<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boards</title>
  </head>
  <body>
    <h1>Your Boards</h1>
    <div id="boards-container"></div>

    <h2>Create a new board</h2>
    <form id="create-board-form">
      <input
        type="text"
        id="board-name"
        placeholder="New board name"
        required
      />
      <button type="submit">Create</button>
    </form>

    <script type="module">
      import { fetchWithAuth } from '{{ url_for("static", filename="fetch.js") }}';

      const boardsContainer = document.getElementById("boards-container");

      async function fetchAndDisplayBoards() {
        try {
          const response = await fetchWithAuth("/api/board/boards");
          if (!response.ok) {
            throw new Error("Failed to fetch boards");
          }
          const boards = await response.json();
          boardsContainer.innerHTML = "";
          if (boards.length === 0) {
            boardsContainer.innerHTML = "<p>No boards found. Create one!</p>";
            return;
          }
          const ul = document.createElement("ul");
          boards.forEach((board) => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = `/board/${board.id}`;
            a.textContent = board.name;
            li.appendChild(a);
            ul.appendChild(li);
          });
          boardsContainer.appendChild(ul);
        } catch (error) {
          console.error("Error fetching boards:", error);
          boardsContainer.innerHTML = "<p>Error loading boards</p>";
        }
      }

      document
        .getElementById("create-board-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const boardName = document.getElementById("board-name").value;
          try {
            const response = await fetchWithAuth("/api/board/create", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ name: boardName }),
            });
            if (response.ok) {
              document.getElementById("board-name").value = "";
              fetchAndDisplayBoards();
            } else {
              const errorData = await response.json();
              console.error("Error creating board:", errorData.message);
            }
          } catch (error) {
            console.error("Error creating board:", error);
          }
        });

      document.addEventListener("DOMContentLoaded", fetchAndDisplayBoards);
    </script>
  </body>
</html>
