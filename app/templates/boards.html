{% extends "base.html" %} 

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='boards.css') }}" />
{% endblock %} 

{% block content %}
<div class="boards-page-wrapper">
  <div class="boards-container">
    <p class="title text-3xl">Your Boards</p>
    <div id="boards-container"></div>

    <button class="board-card create-board-btn">
      <span class="text-md">Create new board</span>
    </button>
    <h2>Create a new board</h2>
    <form id="create-board-form">
      <input
        type="text"
        id="board-name"
        placeholder="New board name"
        required
      />
      <button type="submit">Create</button>
    </form>
  </div>
</div>
{% endblock %} 

{% block scripts %}
<script src="{{ url_for('static', filename='boards.js') }}"></script>
{% endblock %}
