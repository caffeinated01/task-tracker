{% extends "base.html" %} 

{% block content %}
<h1>Your Boards</h1>
<div id="boards-container"></div>

<h2>Create a new board</h2>
<form id="create-board-form">
  <input type="text" id="board-name" placeholder="New board name" required />
  <button type="submit">Create</button>
</form>

<style>
  .user-list ul {
    display: inline-flex;
    list-style: none;
    padding: 0;
    margin: 0 0 0 10px;
  }
  .user-list li {
    margin-right: 10px;
    background-color: #f0f0f0;
    padding: 5px;
    border-radius: 3px;
  }
</style>
{% endblock %} 

{% block scripts %}
<script src="{{ url_for('static', filename='boards.js') }}"></script>
{% endblock %}
