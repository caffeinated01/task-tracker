{% extends "base.html" %} 

{% block css %}
<link
  href="{{ url_for('static', filename='board_disp.css') }}"
  rel="stylesheet"
/>
{% endblock %}

{% block content %}
<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-big-group">
      <a href="/boards" class="navbar-big">
        <span class="text-2xl">Kanban</span>
      </a>
      <input
        type="text"
        class="navbar-big navbar-big-input text-2xl"
        id="board-name"
        aria-label="Board name"
      />
    </div>
    <div class="navbar-menu">
      <button data-handler="shareboard" class="navbar-button text-md">Share Board</button> 
      <div class="navbar-user-dropdown">
        <button class="navbar-button navbar-user-button" data-handler="usermenubtn">
          <div class="avatar">
            <span id="user-avatar" class="text-md"></span>
          </div>
          <span id="user-username" class="text-md"></span>
        </button>
        <div class="navbar-user-menu" hidden>
          <a class="navbar-user-menu-item" data-handler="logout">Logout</a>
        </div>
      </div>
    </div>
  </div>
</nav>
<div class="flex-base">
  <div class="base board-container">
    <div class="status" id="status_1">
      <div class="flex-status">
        <div class="status-head">
          <p class="status-title text-2xl">Pending</p>
          <div class="sort-controls">
            <span class="sort-label">Sort by:</span>
            <select name="sort-category" class="sort-category">
              <option value="name">Name</option>
              <option value="created_at">Date created</option>
              <option value="created_by">Creator</option>
              <option value="importance">Importance</option>
            </select>
            <select name="sort-option" class="sort-option">
              <option value="asc">ASC</option>
              <option value="desc">DESC</option>
            </select>
          </div>
        </div>
        <div class="status-list">
          <div class="status-tasks"></div>
        </div>
        <div class="status-addnew">
          <button class="status-addnew-box text-md" data-handler="addpost_1">
            Add new task
          </button>
        </div>
      </div>
    </div>
    <div class="status" id="status_2">
      <div class="flex-status">
        <div class="status-head">
          <p class="status-title text-2xl">In progress</p>
          <div class="sort-controls">
            <span class="sort-label">Sort by:</span>
            <select name="sort-category" class="sort-category">
              <option value="name">Name</option>
              <option value="created_at">Date created</option>
              <option value="created_by">Creator</option>
              <option value="importance">Importance</option>
            </select>
            <select name="sort-option" class="sort-option">
              <option value="asc">ASC</option>
              <option value="desc">DESC</option>
            </select>
          </div>
        </div>
        <div class="status-list">
          <div class="status-tasks"></div>
        </div>
        <div class="status-addnew">
          <button class="status-addnew-box text-md" data-handler="addpost_2">
            Add new task
          </button>
        </div>
      </div>
    </div>
    <div class="status" id="status_3">
      <div class="flex-status">
        <div class="status-head">
          <p class="status-title text-2xl">Done</p>
          <div class="sort-controls">
            <span class="sort-label">Sort by:</span>
            <select name="sort-category" class="sort-category">
              <option value="name">Name</option>
              <option value="created_at">Date created</option>
              <option value="created_by">Creator</option>
              <option value="importance">Importance</option>
            </select>
            <select name="sort-option" class="sort-option">
              <option value="asc">ASC</option>
              <option value="desc">DESC</option>
            </select>
          </div>
        </div>
        <div class="status-list">
          <div class="status-tasks"></div>
        </div>
        <div class="status-addnew">
          <button class="status-addnew-box text-md" data-handler="addpost_3">
            Add new task
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="hover-preview">
  <div class="hover-preview-inner">
    <h3>Set status to "blah"</h3>
  </div>
</div>
<template id="task-template">
  <div class="task" id="task" draggable="true">
    <div class="task-header">
      <h3 draggable="false">Task name</h3>
      <div class="option-dropdown-comp" draggable="false">
        <button class="option-button" data-handler="optionbtn">
          <svg style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
            <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
          </svg>
        </button>
        <div class="option-dropdown-menu" hidden>
          <a class="option-dropdown-select" data-handler="editbtn">Edit</a>
          <a class="option-dropdown-select" data-handler="deletebtn">Delete</a>
        </div>
      </div>
    </div>
    <p class="task-desc text-sm" draggable="false">Task details</p>
    <div class="task-meta" draggable="false">
      <div class="importance-track">
        <div class="importance-bar" aria-label="Importance"></div>
      </div>
      <div class="task-footer text-xs"></div>
    </div>
  </div>
</template>
<template id="post-modal-template">
  <div class="modal-window">
    <div class="modal-title">
      <p class="text-2xl">Task</p>
      <button class="modal-close" data-modal-action="close">✕</button>
    </div>
    <div class="modal-content">
      <input
        placeholder="Task name"
        rows="1"
        class="title-input text-md"
        id="title-input"
      ></input>
      <textarea
        placeholder="Task description (optional)"
        rows="5"
        class="desc-textarea text-md"
        id="desc-textarea"
      ></textarea>
      <div class="modal-field">
        <label class="modal-label text-sm" for="importance-input">Importance</label>
        <select class="modal-select text-md" id="importance-input">
          <option value="1">Low</option>
          <option value="2">Medium</option>
          <option value="3">High</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label text-sm" for="assigned-to-input">Assigned to</label>
        <select class="modal-select text-md" id="assigned-to-input">
          <option value="">Unassigned</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button
        class="modal-button submit-btn text-lg"
        data-handler="submitmodal"
      >
        Submit
      </button>
    </div>
  </div>
</template>
<template id="delete-modal-template">
  <div class="modal-window">
    <div class="modal-title">
      <p class="text-2xl">Delete task?</p>
    </div>
    <div class="modal-content">
      <span class="text-md"
        >Are you sure you would like to delete this task?</span
      >
    </div>
    <div class="modal-footer">
      <button class="modal-button text-md" data-handler="deletemodal">
        Delete
      </button>
      <button
        class="modal-button modal-button-secondary text-md"
        data-modal-action="close"
      >
        Cancel
      </button>
    </div>
  </div>
</template>
<template id="share-modal-template">
  <div class="modal-window">
    <div class="modal-title">
      <p class="text-2xl">Share</p>
      <button class="modal-close" data-modal-action="close">✕</button>
    </div>
    <div class="modal-content">
      <input
        type="text"
        placeholder="Add collaborators to this board"
        rows="1"
        class="title-input text-md"
        id="share-input"
      ></input>
      <button
        class="modal-button submit-btn text-lg"
        data-handler="sharesubmit"
      >
        Share
      </button>
      <div class="collaborators-list-wrapper">
        <p class="text-xl">People with access</p>
        <div id="collaborators-list">
          <div>
            <div class="user-details">
              <div class="username-group">
                <div class="user-icon">A</div>
                <p class="text-md">Admin</p>
              </div>
              <div class="user-role-group">
                <p class="text-md user-role">Editor</p>
                <button class="revoke-button">
                  ✕
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
    </div>
  </div>
</template>
{% endblock %} 

{% block scripts %}
<script src="{{ url_for('static', filename='board_disp.js') }}"></script>
{% endblock %}
