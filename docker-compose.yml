services:
  web:
    container_name: task-tracker
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/instance
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  app_data:
